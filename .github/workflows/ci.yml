name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
          - { name: Linux, os: ubuntu-22.04 }
    runs-on: ${{ matrix.os }}
    env:
      # The media pipeline tests fail instead of skipping without FFmpeg.
      KERF_REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - name: FFmpeg
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              curl -fsSL -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
              mkdir -p "$RUNNER_TEMP/ffmpeg" && tar -xf ffmpeg.tar.xz -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
              echo "KERF_FFMPEG_DIR=$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_ENV" ;;
            Windows)
              curl -fsSL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
              7z x ffmpeg.zip -o"$RUNNER_TEMP/ffmpeg" > /dev/null
              echo "KERF_FFMPEG_DIR=$(cygpath -w "$RUNNER_TEMP/ffmpeg/ffmpeg-master-latest-win64-gpl/bin")" >> "$GITHUB_ENV" ;;
            macOS)
              brew install ffmpeg ;;
          esac
      - run: npm ci
      # Type check and frontend bundle (the Rust shell embeds it).
      - run: npm run build
      - run: npm test
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  bundle:
    name: Installer (${{ matrix.name }})
    # Unsigned for updates (no secrets needed); release.yml builds the signed ones.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, args: "" }
          - { name: macOS, os: macos-latest, args: "" }
          - { name: Linux, os: ubuntu-22.04, args: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - run: npm ci
      - run: npx tauri build --config src-tauri/tauri.unsigned.conf.json ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        with:
          name: kerf-${{ runner.os }}
          retention-days: 7
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
