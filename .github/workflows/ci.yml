name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Kerf is released for Windows only; macOS and Linux are not built or tested.
  test:
    name: Tests (Windows)
    runs-on: windows-latest
    env:
      # The media pipeline tests fail instead of skipping without FFmpeg.
      KERF_REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: FFmpeg
        shell: bash
        run: |
          curl -fsSL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          7z x ffmpeg.zip -o"$RUNNER_TEMP/ffmpeg" > /dev/null
          echo "KERF_FFMPEG_DIR=$(cygpath -w "$RUNNER_TEMP/ffmpeg/ffmpeg-master-latest-win64-gpl/bin")" >> "$GITHUB_ENV"
      - run: npm ci
      # Type check and frontend bundle (the Rust shell embeds it).
      - run: npm run build
      - run: npm test
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  bundle:
    name: Installer (Windows)
    # Unsigned for updates (no secrets needed); release.yml builds the signed one.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx tauri build --config src-tauri/tauri.unsigned.conf.json
      - uses: actions/upload-artifact@v7
        with:
          name: kerf-Windows
          retention-days: 7
          path: target/release/bundle/nsis/*.exe
