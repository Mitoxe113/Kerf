[workspace]
resolver = "2"
members = ["crates/kerf-core", "crates/kerf-media", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Kerf"]
rust-version = "1.82"

[workspace.dependencies]
kerf-core = { path = "crates/kerf-core" }
kerf-media = { path = "crates/kerf-media" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
log = "0.4"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
